[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "racedna"
version = "0.4.0"
description = "Simple local racing DB: upload meeting/results/screenshots and tip from trends"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ocr = ["pillow>=10.0", "pytesseract>=0.3.10"]
dev = ["pytest>=8.0", "pillow>=10.0", "pytesseract>=0.3.10"]

[project.scripts]
racedna = "racedna.cli:main"

[tool.setuptools.packages.find]
include = ["racedna*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
