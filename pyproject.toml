[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "racedna"
version = "0.1.0"
description = "Personal horse racing history DB and trend tipper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
racedna = "racedna.cli:main"

[tool.setuptools.packages.find]
include = ["racedna*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
