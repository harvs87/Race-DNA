[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "racedna"
version = "0.5.1"
description = "Simple local racing DB: upload meeting/results/screenshots and tip from trends"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
]

[project.optional-dependencies]
ocr = ["pillow>=10.0", "pytesseract>=0.3.10"]
dev = ["pytest>=8.0", "httpx>=0.27", "pillow>=10.0", "pytesseract>=0.3.10"]

[project.scripts]
racedna = "racedna.cli:main"

[tool.setuptools.packages.find]
include = ["racedna*"]

[tool.setuptools.package-data]
racedna = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
